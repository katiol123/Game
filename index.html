<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Лига Шести Камней</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="bg">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
    <div class="grid-floor"></div>
  </div>

  <!-- ============ ВЫБОР ГЕРОЯ ============ -->
  <section class="screen" id="scr-select">
    <div class="sel-glow" id="selGlow"></div>
    <header class="sel-head">
      <div class="kicker">Лига Шести Камней · сезон I</div>
      <h1>Выбери своего героя</h1>
    </header>

    <div class="sel-body">
      <div class="carousel" id="carousel">
        <div class="track" id="track"></div>
        <button class="nav prev" id="prevBtn" aria-label="Предыдущий">‹</button>
        <button class="nav next" id="nextBtn" aria-label="Следующий">›</button>
      </div>

      <div class="hero-info" id="heroInfo">
        <div class="hi-inner" id="hiInner"></div>
      </div>
    </div>

    <div class="dots" id="dots"></div>
    <div class="sel-actions">
      <button class="cta" id="chooseBtn"><span>Выбрать героя</span></button>
      <button class="ghost" id="spectateBtn">👁 Режим зрителя</button>
    </div>
  </section>

  <!-- ============ ЛИГА ============ -->
  <section class="screen" id="scr-league">
    <header class="league-head">
      <div class="lh-left">
        <div class="kicker">Лига Шести Камней</div>
        <h1 class="lh-title">Сезон I</h1>
        <div class="lh-sub" id="tourInfo"></div>
      </div>
      <div class="lh-me" id="meChip"></div>
      <div class="lh-actions">
        <button class="cta play" id="playBtn"><span>▶ Играть</span></button>
        <button class="ghost" id="newBtn">↺ Новый турнир</button>
      </div>
    </header>

    <nav class="tabs" id="tabs">
      <button data-tab="table" class="active">Турнирная таблица</button>
      <button data-tab="schedule">Расписание</button>
      <span class="tab-ink" id="tabInk"></span>
    </nav>

    <div class="panes" id="panes">
      <div class="pane active" id="pane-table"></div>
      <div class="pane" id="pane-schedule"></div>
    </div>
  </section>

  <!-- ============ СТРАНИЦА ГЕРОЯ ============ -->
  <section class="screen" id="scr-hero">
    <button class="ghost back" id="heroBack">← Назад</button>
    <div class="hero-page" id="heroPage"></div>
  </section>

  <!-- ============ МАТЧ ============ -->
  <section class="screen" id="scr-match">
    <header class="match-head">
      <div class="round" id="matchInfo"></div>
    </header>
    <main class="match-main">
      <section class="player" id="mp0">
        <div class="m-sprite-wrap"><img class="m-sprite" alt="" /><div class="dmg-badge" title="Урон за удар">⚔ <b class="dmg">0</b></div><div class="inj-cross" hidden>✚</div></div>
        <div class="side"></div>
        <div class="name"></div>
        <div class="you" hidden>ВЫ</div>
        <div class="status"></div>
        <div class="hp">
          <div class="hp-top"><span>❤</span><b class="hp-val">0</b><small>/ <span class="hp-max">0</span></small></div>
          <div class="hp-bar"><i class="hp-ghost"></i><i class="hp-fill"></i></div>
        </div>
        <div class="charge c1">
          <div class="charge-bar"><i class="charge-fill"></i></div>
          <small>⚡ <span class="charge-txt">0 / 0</span></small>
        </div>
        <div class="charge c2" hidden>
          <div class="charge-bar"><i class="charge-fill"></i></div>
          <small>🔫 2-й ствол (комбо) <span class="charge-txt">0 / 0</span></small>
        </div>
        <div class="score">0</div>
        <div class="meta">
          <span>Ходов: <b class="moves">0</b> · макс. комбо: <b class="combo">0</b></span>
        </div>
        <div class="thinking"><i></i><i></i><i></i></div>
      </section>

      <div class="board-wrap" id="boardWrap">
        <canvas id="board"></canvas>
        <div class="banner" id="banner"></div>
        <div class="overlay" id="resultOverlay">
          <div class="overlay-card" id="resultCard"></div>
        </div>
      </div>

      <section class="player" id="mp1">
        <div class="m-sprite-wrap"><img class="m-sprite" alt="" /><div class="dmg-badge" title="Урон за удар">⚔ <b class="dmg">0</b></div><div class="inj-cross" hidden>✚</div></div>
        <div class="side"></div>
        <div class="name"></div>
        <div class="you" hidden>ВЫ</div>
        <div class="status"></div>
        <div class="hp">
          <div class="hp-top"><span>❤</span><b class="hp-val">0</b><small>/ <span class="hp-max">0</span></small></div>
          <div class="hp-bar"><i class="hp-ghost"></i><i class="hp-fill"></i></div>
        </div>
        <div class="charge c1">
          <div class="charge-bar"><i class="charge-fill"></i></div>
          <small>⚡ <span class="charge-txt">0 / 0</span></small>
        </div>
        <div class="charge c2" hidden>
          <div class="charge-bar"><i class="charge-fill"></i></div>
          <small>🔫 2-й ствол (комбо) <span class="charge-txt">0 / 0</span></small>
        </div>
        <div class="score">0</div>
        <div class="meta">
          <span>Ходов: <b class="moves">0</b> · макс. комбо: <b class="combo">0</b></span>
        </div>
        <div class="thinking"><i></i><i></i><i></i></div>
      </section>
    </main>

    <footer class="match-foot">
      <div class="controls">
        <button id="pauseBtn">⏸ Пауза</button>
        <div class="speed" id="speed">
          <span>Скорость:</span>
          <button data-speed="0.5">0.5×</button>
          <button data-speed="1" class="active">1×</button>
          <button data-speed="2">2×</button>
          <button data-speed="4">4×</button>
        </div>
        <button id="skipBtn">⏭ Досчитать матч</button>
      </div>
      <ul class="log" id="log"></ul>
    </footer>
  </section>

  <!-- ============ ЭФФЕКТЫ ПЕРЕХОДОВ ============ -->
  <div class="vs" id="vs">
    <div class="vs-side left" id="vsLeft"></div>
    <div class="vs-side right" id="vsRight"></div>
    <div class="vs-mark">VS</div>
    <div class="vs-info" id="vsInfo"></div>
  </div>
  <div id="fx"></div>
  <div class="audio-ctl">
    <button id="musicBtn" title="Музыка вкл/выкл" aria-label="Музыка">🎵</button>
    <button id="sfxBtn" title="Звуки вкл/выкл" aria-label="Звуки">🔊</button>
  </div>

  <script src="js/audio.js"></script>
  <script src="js/data.js"></script>
  <script src="js/league.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
