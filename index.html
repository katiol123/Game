<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Три в ряд — ИИ против ИИ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
  </div>

  <header>
    <h1>Три в ряд <small>ИИ против ИИ</small></h1>
    <div class="round" id="round">Ход 1 / 20</div>
  </header>

  <main>
    <section class="player" id="p0">
      <div class="avatar"></div>
      <div class="name"></div>
      <div class="style"></div>
      <div class="score">0</div>
      <div class="meta">
        <span>Ходов: <b class="moves">0</b></span>
        <span>Макс. комбо: <b class="combo">0</b></span>
      </div>
      <div class="thinking"><i></i><i></i><i></i></div>
    </section>

    <div class="board-wrap" id="boardWrap">
      <canvas id="board"></canvas>
      <div class="banner" id="banner"></div>
      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <div class="trophy">🏆</div>
          <h2 id="winnerText"></h2>
          <p id="finalScores"></p>
          <p class="countdown" id="countdown"></p>
          <button id="againBtn">Новая партия</button>
        </div>
      </div>
    </div>

    <section class="player" id="p1">
      <div class="avatar"></div>
      <div class="name"></div>
      <div class="style"></div>
      <div class="score">0</div>
      <div class="meta">
        <span>Ходов: <b class="moves">0</b></span>
        <span>Макс. комбо: <b class="combo">0</b></span>
      </div>
      <div class="thinking"><i></i><i></i><i></i></div>
    </section>
  </main>

  <footer>
    <div class="controls">
      <button id="pauseBtn">⏸ Пауза</button>
      <div class="speed" id="speed">
        <span>Скорость:</span>
        <button data-speed="0.5">0.5×</button>
        <button data-speed="1" class="active">1×</button>
        <button data-speed="2">2×</button>
        <button data-speed="4">4×</button>
      </div>
      <button id="restartBtn">↻ Заново</button>
    </div>
    <ul class="log" id="log"></ul>
  </footer>

  <script src="game.js"></script>
</body>
</html>
